<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Listo</title>
<meta name="description" content="Trip Listo is a free trip checklist. Plan it, book it, pack it and lock the door. No account, and your trips stay on your device.">
<meta name="theme-color" content="#13203A">
<meta property="og:title" content="Trip Listo">
<meta property="og:description" content="A free trip checklist: plan, book, pack and leave the house without forgetting anything.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://harshapoloju.github.io/trip-listo/">
<meta property="og:image" content="https://harshapoloju.github.io/trip-listo/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Listo">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  /* Layout idea: a navy boarding pass up top (destination, flight-path progress, ticket stub), quiet white cards below, tabs in a bottom bar. Brass is the only accent. */
  --paper:#E8EBF0; --card:#FFFFFF; --ink:#13203A; --muted:#5F6B85; --line:#D3D9E3;
  --accent:#B98A2F; --accent-ink:#13203A; --ok:#1E7D5A; --on-ok:#FFFFFF; --danger:#B3382C;
  --ticket:#13203A; --ticket-ink:#F3EEE2; --ticket-muted:#9AA6C0; --ticket-line:rgba(243,238,226,.24); --gold:#D8B46A; --mint:#6FD3A6;
  --shadow:0 1px 2px rgba(19,32,58,.04),0 10px 26px -14px rgba(19,32,58,.18);
  --display:'Bodoni Moda','Didot','Bodoni MT','Playfair Display',Georgia,serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1120; --card:#131C30; --ink:#ECE7DB; --muted:#8C98B3; --line:#243049;
    --accent:#D8B46A; --accent-ink:#0A1120; --ok:#58C596; --on-ok:#08110D; --danger:#F08A7E;
    --ticket:#1A2744; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1120; --card:#131C30; --ink:#ECE7DB; --muted:#8C98B3; --line:#243049;
  --accent:#D8B46A; --accent-ink:#0A1120; --ok:#58C596; --on-ok:#08110D; --danger:#F08A7E;
  --ticket:#1A2744; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px calc(108px + env(safe-area-inset-bottom))}
header{padding:4px 0 0}

/* Brand and trip switcher */
.brand-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-style:italic;font-weight:600;font-size:28px;letter-spacing:-.01em;line-height:1}
.tagline{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.switch{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;margin:0 -16px;scrollbar-width:none}
.switch::-webkit-scrollbar{display:none}
.tchip{flex:none;display:flex;align-items:center;gap:8px;max-width:210px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.tchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tchip[aria-pressed="true"] i{color:var(--paper);opacity:.7}
.tchip.add{border-style:dashed;background:transparent;color:var(--muted)}

/* Boarding pass */
.ticket{position:relative;margin-top:10px;background:var(--ticket);color:var(--ticket-ink);border-radius:20px;padding:18px 20px 16px;box-shadow:0 20px 40px -24px rgba(10,17,32,.6)}
.tk-top{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ticket-muted)}
#readyLbl{color:var(--gold)}
.trip{display:block;width:100%;border:0;background:transparent;color:var(--ticket-ink);font-family:var(--display);font-weight:600;font-size:48px;line-height:1.08;letter-spacing:-.015em;padding:8px 0 4px;margin:0;caret-color:var(--gold)}
.trip::placeholder{color:var(--ticket-muted);font-style:italic}
.trip:focus{outline:0}
.meter{position:relative;height:24px;margin:6px 11px 0}
.meter::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed var(--ticket-line)}
.meter i{position:absolute;left:0;top:50%;height:2px;margin-top:-1px;width:0;background:var(--gold);border-radius:2px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.plane{position:absolute;top:50%;left:0;width:22px;height:22px;margin:-11px 0 0 -11px;color:var(--gold);transition:left .5s cubic-bezier(.2,.7,.2,1)}
.plane svg{display:block;width:100%;height:100%;transform:rotate(90deg);fill:currentColor}
.meter.done i{background:var(--mint)}
.meter.done .plane{color:var(--mint)}
.tk-stub{position:relative;display:grid;grid-template-columns:1.5fr 1fr auto;gap:14px;margin-top:14px;padding-top:14px;border-top:1.5px dashed var(--ticket-line)}
.tk-stub::before,.tk-stub::after{content:'';position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
.tk-stub::before{left:-30px}
.tk-stub::after{right:-30px}
.tk-stub div{min-width:0}
.tk-stub small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ticket-muted)}
.tk-stub b{display:block;font-weight:600;font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.banner{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(111,211,166,.14);border:1px solid rgba(111,211,166,.4);color:#CFF3E2;font-weight:600;font-size:15px}
.banner span{flex:1}
.banner .btn{background:var(--mint);color:#08110D;border-color:var(--mint)}

/* Edit and copy tools */
.bar{display:flex;justify-content:flex-end;margin:14px 0 -6px}
.bar-in{display:flex;gap:8px}
.bar .btn{padding:7px 14px;font-size:13px;border-radius:999px}
.bar .btn.alt{background:var(--card)}
#editBtn[aria-pressed="true"]{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;padding:12px 24px;font-size:15px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 12px 30px -8px rgba(10,17,32,.55)}

/* Bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-top:1px solid var(--line)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:8px 2px 2px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em;line-height:1.3}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab small{font-family:var(--mono);font-weight:400;font-size:10px;min-height:14px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::before{content:'';position:absolute;top:-7px;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab.full small{color:var(--ok)}

/* Content */
.label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 2px 10px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;transition:background .15s,color .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 14px;overflow:hidden;box-shadow:var(--shadow)}
.card h2{margin:0;display:flex;align-items:center;gap:10px;padding:16px 14px 13px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
.card h2 .count{margin-left:auto;flex:none;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card h2 .count.full{color:var(--ok)}
.row{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:54px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.check{flex:none;width:26px;height:26px;border:1.5px solid var(--muted);border-radius:50%;background:transparent;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.check svg{width:16px;height:16px;opacity:0;stroke:var(--on-ok);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.check[aria-checked="true"] svg{opacity:1}
.txt{flex:1;padding:14px 0;font-size:16px;overflow-wrap:anywhere;background:none;border:0;text-align:left}
.row.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.edit-in{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:10px 0;font-size:16px}
.edit-in:focus{outline:0;border-color:var(--accent)}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--danger);font-family:var(--body);font-size:22px;line-height:1}
.add{display:flex;gap:8px;padding:12px 14px;background:color-mix(in srgb,var(--paper) 55%,var(--card));border-top:1px solid var(--line)}
.add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;font-size:16px}
.add.col{flex-direction:column}
.add.col .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add.col input{width:100%}
form.card.add{border-top:1px solid var(--line)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;line-height:1.2}
.btn.alt{background:transparent;color:var(--ink);border-color:color-mix(in srgb,var(--ink) 28%,transparent)}
.btn.danger{border-color:color-mix(in srgb,var(--danger) 55%,transparent);color:var(--danger);background:transparent}
.mini{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:0;line-height:1.2}
.link-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.link-row:last-child{border-bottom:0}
.link-main{flex:1;min-width:0}
.link-main a{font-weight:600;font-size:16px;color:var(--ink);text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.link-main span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.link-main a.off{color:var(--muted);text-decoration:none;pointer-events:none}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.fields .full{grid-column:1/-1}
.field{min-width:0}
.field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--paper) 55%,var(--card));padding:10px 12px;font-size:16px;min-height:46px}
.field input[type=date]{min-width:0;max-width:100%;display:block}
.pad{padding:0 14px 14px}
.pad .label{margin:4px 0 10px}
.prompt{margin:0;padding:14px;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;background:color-mix(in srgb,var(--paper) 55%,var(--card));border-top:1px solid var(--line)}
.hint{padding:12px 14px;color:var(--muted);font-size:14px}
.warn{color:var(--danger);font-size:14px;margin:0 0 10px}
.warn:empty{display:none}
.row-edit{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--line)}
.row-edit .stack{display:grid;gap:8px}
.row-edit .field input{padding:8px 10px;min-height:40px;font-size:15px}
.actions{display:grid;gap:8px;padding:14px}
.filebtn{display:block;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0}
.qr{background:#fff;border-radius:12px;padding:8px;width:min(260px,100%);margin:0 auto}
.qr svg{display:block;width:100%;height:auto}
.xfer-out{display:grid;gap:10px;padding:0 14px 14px}
.xfer-out:empty{display:none}
.xfer-out .label{margin:0}
.xfer-out textarea,.actions textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--paper) 55%,var(--card));padding:10px 12px;font-size:13px;font-family:var(--mono)}
.incoming{margin:14px 0 0;border-color:var(--accent)}
.incoming .actions{padding-top:0}
.empty{padding:18px 14px;color:var(--muted)}
.foot{margin:26px 0 0;font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;left:16px;right:16px;bottom:calc(146px + env(safe-area-inset-bottom));z-index:8;max-width:528px;margin:0 auto;background:#13203A;color:#F3EEE2;border:1px solid rgba(243,238,226,.16);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:15px;box-shadow:0 14px 34px -12px rgba(10,17,32,.6)}
.toast span{flex:1}
.toast button{border:0;background:transparent;color:#D8B46A;font-weight:600;font-size:15px;padding:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand-row"><span class="brand" id="brand">Trip Listo</span><span class="tagline">Plan it. Pack it. Lock the door.</span></div>
    <div class="switch" id="switch" role="group" aria-label="Your trips"></div>
    <div id="tripHead" class="ticket">
      <div class="tk-top"><span id="readyLbl">Ready</span><span>Boarding pass</span></div>
      <input id="tripName" class="trip" type="text" placeholder="Where to?" aria-label="Trip destination" maxlength="40" autocomplete="off">
      <div class="meter" id="meter" role="progressbar" aria-label="Trip readiness" aria-valuemin="0" aria-valuemax="100"><i id="meterFill"></i><span class="plane" id="plane" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></span></div>
      <div class="tk-stub">
        <div><small>Dates</small><b id="tkDates">Not set</b></div>
        <div><small>Travelers</small><b id="tkWho">2 people</b></div>
        <div><small>Ready</small><b><span id="doneN">0</span>/<span id="totalN">0</span></b></div>
      </div>
      <div id="banner"></div>
    </div>
  </header>
  <div id="incoming"></div>
  <div class="bar" id="bar"><div class="bar-in">
    <button class="btn alt" id="copyBtn">Copy as text</button>
    <button class="btn alt" id="editBtn" aria-pressed="false">Edit</button>
  </div></div>
  <main id="view"></main>
  <p class="foot">Your trips are saved on this device only. Built by Harsha with Claude.</p>
</div>
<nav class="tabs" role="tablist" id="tabs" aria-label="Sections"></nav>
<div id="toastHost"></div>

<script src="qrcode.js"></script>
<script>
(function(){
  /* Change the app name here. It updates the badge, the tab title and the messages. */
  var APP='Trip Listo';
  var KEY='carryon-v2',OLDKEY='pretrip-v1';
  var uid=function(){return Math.random().toString(36).slice(2,9)};
  var it=function(t){return {id:uid(),text:t,done:false}};

  var TEMPLATES=[
    {tpl:'essentials',group:'pack',title:'Essentials',items:['Phone and charger','Wallet and cards','Photo ID / driver\'s license','Keys','Medications','Toiletries','Sunglasses','Water bottle']},
    {tpl:'office',group:'pack',title:'Office trip',items:['Laptop','Laptop charger','Work badge','Notebook and pen','Business clothes','Presentation and files backed up','Earbuds']},
    {tpl:'hiking',group:'pack',title:'Hiking and camping',items:['Backpack','Hiking shoes','Extra socks','Rain jacket','Warm layers / fleece','Headlamp','First-aid kit','Trail snacks','Sunscreen and bug spray','Offline trail map','Bear spray (where needed)']},
    {tpl:'flying',group:'pack',title:'Flying',items:['Passport or government ID','Boarding pass','Travel adapter','Power bank','Neck pillow','Liquids in a clear bag (100 ml / 3.4 oz each)','Headphones']},
    {tpl:'road',group:'pack',title:'Road trip',items:['Driver\'s license','Car insurance and registration','Check the spare tire and jack','Phone mount and car charger','Cooler and snacks','Playlists and podcasts downloaded','Cash for tolls and park fees']},
    {tpl:'transit',group:'pack',title:'Train or bus',items:['Tickets or pass (saved offline on my phone)','Photo ID','Check the departure station or stop and platform','Seat reservation confirmed','Snacks and a refillable water bottle','Headphones and downloaded shows or music','Power bank and short charging cable','Small day bag for things I need on board','Layer for cold air conditioning','Cash or card for local transit']},
    {tpl:'beach',group:'pack',title:'Beach and pool',items:['Swimsuit','Towel','Flip-flops','Sunscreen','Hat','Dry bag']},
    {tpl:'kids',group:'pack',title:'With kids',items:['Snacks','Spare clothes','Wipes and diapers','Favorite toy or comfort item','Tablet and headphones','Kids\' medications']},
    {tpl:'work',group:'home',title:'Work and time off',items:['Apply for leave (PTO) and get it approved','Set an out-of-office auto-reply','Hand off urgent tasks to a teammate','Share dates and a contact plan with my manager','Decide: take the office laptop or leave it','If taking it: pack the laptop and charger','Decline or move meetings during the trip']},
    {tpl:'admin',group:'home',title:'Travel admin',items:['Passport valid 6+ months (international)','Visa or entry permit (if needed)','Travel insurance','Tell the bank and card companies','Local currency or a travel card','Phone roaming plan or eSIM','Save booking confirmations offline','Download offline maps','Share the itinerary with family','Check the weather forecast','Check permits and park reservations']},
    {tpl:'home',group:'home',title:'Before you lock the door',items:['Gas and stove off','Lights off','Windows and doors locked','Heating / cooling set','Unplug small appliances','Take out trash','Clear the fridge of perishables','Water the plants / arrange pet care','Hold mail or tell a neighbor']}
  ];
  var BOOK=[
    {title:'Flights',rows:[['skyscanner','Skyscanner','Compare flight prices','https://www.skyscanner.com'],['gflights','Google Flights','Price calendar and tracking','https://www.google.com/travel/flights']]},
    {title:'Stay',rows:[['booking','Booking.com','Hotels and apartments','https://www.booking.com'],['airbnb','Airbnb','Homes and cabins','https://www.airbnb.com'],['hostelworld','Hostelworld','Hostels and budget stays','https://www.hostelworld.com']]},
    {title:'Getting around',rows:[['rome2rio','Rome2Rio','Trains, buses and ferries between places','https://www.rome2rio.com'],['kayak-cars','Kayak car rental','Compare rental companies','https://www.kayak.com/cars'],['enterprise','Enterprise','Rent directly','https://www.enterprise.com'],['hertz','Hertz','Rent directly','https://www.hertz.com']]},
    {title:'Things to do',rows:[['ticketmaster','Ticketmaster','Concerts and shows','https://www.ticketmaster.com'],['luma','Luma','Local events and meetups','https://lu.ma'],['eventbrite','Eventbrite','Events and experiences','https://www.eventbrite.com'],['alltrails','AllTrails','Hiking routes','https://www.alltrails.com'],['getyourguide','GetYourGuide','Tours and activities','https://www.getyourguide.com']]}
  ];
  function defaultBook(){return BOOK.map(function(g){return {id:'g-'+g.title.toLowerCase().replace(/[^a-z]+/g,'-'),title:g.title,rows:g.rows.map(function(r){return {id:r[0],name:r[1],note:r[2],url:r[3]}})}})}
  function platformDefaults(){return [
    {id:'claude',name:'Claude',url:'https://claude.ai/new?q={prompt}'},
    {id:'chatgpt',name:'ChatGPT',url:'https://chatgpt.com/?q={prompt}'},
    {id:'gemini',name:'Gemini',url:'https://gemini.google.com/app'},
    {id:'aimode',name:'Google AI Mode',url:'https://www.google.com/search?udm=50&q={prompt}'},
    {id:'perplexity',name:'Perplexity',url:'https://www.perplexity.ai/search?q={prompt}'}
  ]}
  function defaultInterests(){return ['Touristy highlights','Offbeat and quiet','Hiking','Adventure','Comfort and relaxing','Food','Nightlife and events','Family friendly']}
  var TRANSPORT=[['fly','Fly'],['drive','Drive'],['train','Train or bus']];

  var state=null;
  function builtin(k){return TEMPLATES.filter(function(t){return t.tpl===k})[0]}
  /* Lists the user created themselves are kept in state.custom so they can be reused on later trips. */
  function allTpls(group){

    if(d.delbk){var bp=d.delbk.split(':'),bg=state.book.filter(function(g){return g.id===bp[0]})[0];if(bg)mutate(function(){bg.rows=bg.rows.filter(function(r){return r.id!==bp[1]})});return}
    if(d.delgroup){var snapG=JSON.stringify(state),gg=state.book.filter(function(g){return g.id===d.delgroup})[0];mutate(function(){state.book=state.book.filter(function(g){return g.id!==d.delgroup})});toast('Removed '+(gg?gg.title:'group'),snapG);return}
    if(d.tog){var p=d.tog.split(':'),s=find(p[0]);if(!s)return;var i=s.items.filter(function(x){return x.id===p[1]})[0];if(i)mutate(function(){i.done=!i.done});return}
    if(d.book){mutate(function(){T.booked[d.book]=!T.booked[d.book]});return}
    if(d.resetbook){var snapB=JSON.stringify(state);mutate(function(){state.book=defaultBook()});toast('Links reset to defaults',snapB);return}
    if(d.skip){mutate(function(){T.skip[d.skip]=!T.skip[d.skip]});return}
    if(d.delcustom){
      var snapC=JSON.stringify(state),ctpl=tplByKey(d.delcustom);
      mutate(function(){
        state.custom=state.custom.filter(function(c){return c.tpl!==d.delcustom});
        state.trips.forEach(function(x){if(!x.archivedAt)x.sections=x.sections.filter(function(s){return s.tpl!==d.delcustom})});
        delete state.memory[d.delcustom];
      });
      toast('Deleted '+(ctpl?ctpl.title:'list'),snapC);return;
    }
    if(d.del){var q=d.del.split(':'),s2=find(q[0]);if(s2)mutate(function(){s2.items=s2.items.filter(function(x){return x.id!==q[1]})});return}
    if(d.resetsec){var rs=find(d.resetsec),rt2=rs&&builtin(rs.tpl);if(rt2)mutate(function(){rs.items=rt2.items.map(it)});return}
    if(d.rmsec){var snap=JSON.stringify(state),sec=find(d.rmsec);mutate(function(){T.sections=T.sections.filter(function(x){return x.id!==d.rmsec})});toast('Removed '+(sec?sec.title:'list')+' from this trip',snap);return}
    if(d.tpl){
      var existing=T.sections.filter(function(s){return s.tpl===d.tpl})[0],t=tplByKey(d.tpl);
      if(existing){var snap2=JSON.stringify(state);mutate(function(){T.sections=T.sections.filter(function(s){return s.tpl!==d.tpl})});toast('Removed '+t.title+' from this trip',snap2)}
      else mutate(function(){T.sections.push(makeSection(t))});
      return;
    }
    if(b.id==='editBtn'){mutate(function(){if(state.edit)endEdit();else state.edit=true});return}
    if(b.id==='copyBtn'){
      var lines=[(T.name||'Trip')+' checklist'];
      if(T.start)lines.push(fmtDates(T));
      var bk=state.book.filter(function(g){return g.rows.length&&!T.skip[g.id]});
      if(bk.length){lines.push('');lines.push('BOOKINGS');bk.forEach(function(g){
        var w=g.rows.filter(function(r){return T.booked[r.id]}).map(function(r){return r.name});
        lines.push((w.length?'[x] ':'[ ] ')+g.title+(w.length?' ('+w.join(', ')+')':''));
      })}
      T.sections.forEach(function(s){lines.push('');lines.push(s.title.toUpperCase());s.items.forEach(function(i){lines.push((i.done?'[x] ':'[ ] ')+i.text)})});
      copyText(lines.join('\n'),'Checklist copied');
      return;
    }
  });
  document.addEventListener('submit',function(e){
    e.preventDefault();
    var f=e.target,T=tr();
    var fix=function(u){u=u.trim();return /^https?:\/\//i.test(u)?u:'https://'+u};
    if(f.hasAttribute('data-addpf')){var pn=f.elements['pn'].value.trim(),pu=f.elements['pu'].value.trim();if(!pn||!pu)return;mutate(function(){state.platforms.push({id:uid(),name:pn,url:fix(pu)})});return}
    if(f.hasAttribute('data-addbk')){var bn=f.elements['bn'].value.trim(),bu=f.elements['bu'].value.trim(),gb=state.book.filter(function(g){return g.id===f.dataset.addbk})[0];if(!bn||!bu||!gb)return;mutate(function(){gb.rows.push({id:uid(),name:bn,note:'',url:fix(bu)})});return}
    var inp=f.querySelector('input'),v=inp.value.trim();
    if(!v)return;
    if(f.dataset.add){var s=find(f.dataset.add);if(s)mutate(function(){s.items.push(it(v))});var n=view.querySelector('[data-add="'+f.dataset.add+'"] input');if(n)n.focus()}
    else if(f.hasAttribute('data-addgroup')){mutate(function(){state.book.push({id:uid(),title:v,rows:[]})})}
    else if(f.hasAttribute('data-addopt')){mutate(function(){if(state.interestOpts.indexOf(v)<0)state.interestOpts.push(v)})}
    else if(f.dataset.newsec){mutate(function(){var k='custom-'+uid();state.custom.push({tpl:k,group:f.dataset.newsec,title:v});T.sections.push({id:uid(),tpl:k,group:f.dataset.newsec,title:v,items:[]})})}
  });
  document.addEventListener('input',function(e){
    var t=e.target,T=tr();
    if(t.dataset&&t.dataset.pf){var pp=t.dataset.pf.split(':'),pl=state.platforms.filter(function(x){return x.id===pp[0]})[0];if(pl){pl[pp[1]]=t.value;save()}return}
    if(t.dataset&&t.dataset.bk){var bk=t.dataset.bk.split(':'),gx=state.book.filter(function(g){return g.id===bk[0]})[0],rx=gx&&gx.rows.filter(function(r){return r.id===bk[1]})[0];if(rx){rx[bk[2]]=t.value;save()}return}
    if(t.dataset&&t.dataset.gt){var gt=state.book.filter(function(g){return g.id===t.dataset.gt})[0];if(gt){gt.title=t.value;save()}return}
    if(t.id==='tripName'){T.name=t.value;save();renderHeader();if(state.tab==='plan')renderAI();return}
    if(t.dataset&&t.dataset.field){
      var f=t.dataset.field,b5=snapT(T),snapF=JSON.stringify(state);
      if(f==='adults'||f==='kids'){var n=parseInt(t.value,10);T[f]=isNaN(n)?0:Math.max(0,Math.min(20,n))}
      else T[f]=t.value;
      var notes2=smart(T,b5);
      save();renderHeader();renderAI();
      if(notes2.length)toast(notes2.join('. ')+'.',snapF);
      return;
    }
    if(t.dataset&&t.dataset.edit){var p=t.dataset.edit.split(':'),s=find(p[0]);if(!s)return;var i=s.items.filter(function(x){return x.id===p[1]})[0];if(i){i.text=t.value;save()}}
  });

  document.addEventListener('change',function(e){
    if(e.target.id==='importFile'&&e.target.files&&e.target.files[0]){
      var r=new FileReader();r.onload=function(){importText(String(r.result))};r.readAsText(e.target.files[0]);
    }
  });
  window.addEventListener('hashchange',checkHash);
  tidy();
  render();
  checkHash();
})();
</script>
<script>
/* Offline support: keeps a copy of the app on the device after the first visit. */
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
